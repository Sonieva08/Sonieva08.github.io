<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
 <title>Sonieva Oliviera Alphonse · Portfolio</title>
<meta name="description" content="Portfolio de Sonieva Oliviera Alphonse : développement web, cybersécurité et réseaux.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛡️%3C/text%3E%3C/svg%3    E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/projects/favicon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: "#0b1f3a",
            electric: "#0051d5",
            electric2: "#316bf3",
            page: "#faf8ff",
            mist: "#f2f3ff",
            mist2: "#eaedff",
            mist3: "#dbe1ff",
            ink: "#131b2e",
            soft: "#44474d"
          },
          fontFamily: {
            display: ["Plus Jakarta Sans", "sans-serif"],
            sans: ["Inter", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 72px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>

<body class="bg-page font-sans text-ink antialiased">

  <!-- ============ MENU ============ -->
  <header class="fixed top-0 inset-x-0 z-50 bg-white/85 backdrop-blur-xl shadow-sm">
    <div class="h-16 max-w-6xl mx-auto px-5 flex items-center justify-between gap-4">
<a id="brand" href="#accueil" class="shrink-0 font-display font-extrabold text-night text-lg">S.O.A.</a>
      <nav class="flex items-center gap-1 overflow-x-auto text-sm" aria-label="Navigation principale">
        <a href="#accueil" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Accueil</a>
        <a href="#apropos" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">À propos</a>
        <a href="#competences" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Compétences</a>
        <a href="#projets" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Projets</a>
        <a href="#certifications" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Certifications</a>
        <a href="#formation" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Formation</a>
        <a href="#contact" class="px-3 py-1.5 rounded-lg text-soft hover:bg-mist hover:text-night whitespace-nowrap transition">Contact</a>
      </nav>

      <a id="nav-cv" href="documents/CV_Sonieva_Oliviera_Alphonse.pdf" download
         class="hidden md:inline-flex shrink-0 px-4 py-2 rounded-lg bg-night text-white text-sm font-semibold hover:bg-electric transition">
        Télécharger CV
      </a>
    </div>
  </header>

  <main class="pt-16">

    <!-- ============ ACCUEIL ============ -->
    <section id="accueil" class="relative overflow-hidden">
      <div class="absolute -top-32 right-10 w-96 h-96 rounded-full bg-mist3 opacity-50 blur-3xl pointer-events-none"></div>

      <div class="relative max-w-6xl mx-auto px-5 py-16 lg:py-24 grid lg:grid-cols-12 gap-10 items-center">
        <div class="lg:col-span-7 flex flex-col items-start gap-5">
          <div id="availability" class="empty:hidden"></div>
          <h1 id="name" class="font-display text-4xl sm:text-5xl lg:text-6xl font-extrabold text-night tracking-tight leading-tight"></h1>
          <p id="title" class="font-display text-lg sm:text-xl text-soft font-medium"></p>
          <p id="intro" class="text-lg text-ink max-w-2xl leading-relaxed"></p>
          <div id="cta" class="flex flex-wrap gap-3 pt-2"></div>
          <div id="socials" class="flex flex-wrap items-center gap-3 empty:hidden"></div>
        </div>

        <div id="photo" class="lg:col-span-5 flex justify-center lg:justify-end"></div>
      </div>

      <div class="relative max-w-6xl mx-auto px-5 pb-16">
        <div id="stats" class="bg-white rounded-xl shadow-sm p-6 grid grid-cols-3 gap-4 empty:hidden"></div>
      </div>
    </section>

    <!-- ============ À PROPOS ============ -->
    <section id="apropos" class="bg-mist py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">À propos</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <div id="about" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>      </div>
    </section>

    <!-- ============ COMPÉTENCES ============ -->
    <section id="competences" class="py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">Compétences</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <div id="skills" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>

    <!-- ============ PROJETS ============ -->
    <section id="projets" class="bg-mist py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">Projets</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <div id="projects" class="grid gap-6 lg:grid-cols-2"></div>
      </div>
    </section>

    <!-- ============ CERTIFICATIONS ============ -->
    <section id="certifications" class="py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">Certifications</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <ul id="certs" class="flex flex-col gap-4"></ul>
      </div>
    </section>

    <!-- ============ FORMATION ============ -->
    <section id="formation" class="bg-mist py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">Formation</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <ul id="education" class="relative flex flex-col gap-8 pl-10 before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-0.5 before:bg-electric/30"></ul>      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section id="contact" class="py-20">
      <div class="max-w-6xl mx-auto px-5">
        <h2 class="font-display text-3xl font-bold text-night">Contact</h2>
        <div class="w-16 h-1 bg-electric rounded-full mt-3 mb-10"></div>
        <div class="max-w-xl">
          <p id="contact-text" class="text-lg text-soft mb-8 empty:hidden"></p>
          <ul id="contact-list" class="flex flex-col gap-3"></ul>
          <div id="contact-cv" class="mt-8 empty:hidden"></div>
        </div>      </div>
    </section>

  </main>

  <!-- ============ PIED DE PAGE ============ -->
  <footer class="bg-mist py-8">
    <div class="max-w-6xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-soft">
<span>© <span id="year"></span> <span id="footer-name"></span>. Tous droits réservés.</span>      <a href="#accueil" class="hover:text-electric">Haut de page ↑</a>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
